# EJE Job Card Management — continuous integration. ARCH-6, QA-4, AUD-5.
#
# WHY THIS EXISTS. Every verification gate was run by hand, which AUD-5 graded
# an ACCEPTANCE BLOCKER for exactly the reason it says: a gate that depends on
# somebody remembering to run it is a gate a regression walks past. QA-4 names
# the five that must run on every push — lint, typecheck, `npm test`,
# `npm run db:test` and `npm run build` — and all five are below, as the
# project's own commands rather than re-implementations of them.
#
# WHAT IT RUNS, AND WHY IT IS SPLIT IN THREE.
#
#   checks    the gates that need nothing but the project: lint, strict
#             typecheck, the 1900-odd unit and application tests, and the
#             production build.
#   database  the PostgreSQL-backed suite, against a real PostgreSQL 16 — the
#             version production runs — in a disposable service container.
#             These are the tests AUD-6 exists about: a path that has never run
#             against PostgreSQL is a path nobody has tested.
#   browser   the gates that need a built, running application and a real
#             Chromium: the route and permission check, the end-to-end workflow,
#             the signed-document check on both PDF paths, the tablet and phone
#             layout audit, and the smoke suite. QA-4 left this as a decision to record, and
#             the decision is IN CI: these are the only gates that exercise the
#             worker, IndexedDB, the offline queue and the tablet flows, and a
#             manual-only gate for the features most likely to break is not a
#             gate. They run against the DEMONSTRATION backend, in the runner,
#             and reach nothing outside it.
#
# NO SECRETS, AND NOTHING REAL. This workflow declares no secrets, reads none
# and needs none. The database is a throwaway container inside the job, created
# empty and destroyed with it; the application runs on its demonstration data;
# WhatsApp and email are unconfigured, so their adapters refuse rather than
# pretend — which is the behaviour the tests assert. Nothing here connects to
# the VPS, to a production or development database, or to any provider.
#
# NOTHING IS WEAKENED TO GET A GREEN TICK. No `continue-on-error`, no skipped
# suite, no `--passWithNoTests`, no quarantine list. A failing gate fails the
# run, which is the entire point of having one.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A later push supersedes an earlier run on the same branch; a run on the
# default branch is left to finish, because that is the one people read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Reproducible installs and no interactive prompts anywhere.
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` and not `npm install`: the lockfile is the input, and an
      # install that may resolve a different tree is not a reproducible build.
      - name: Install dependencies
        run: npm ci

      # THE LIBRARY'S PRIMARY SEARCH ENGINE. LIB-TEXT-1.
      #
      # `pdftotext` is what reads a manufacturer's manual: the built-in
      # fallback cannot resolve a subset font's /ToUnicode map, which is how
      # nearly every real manual is encoded. Installed EXPLICITLY rather than
      # relied on: the GitHub runner image happens to carry poppler today, and
      # a gate whose result depends on an undeclared package in somebody
      # else's image is a gate that will change its answer without a commit.
      # It is the same package the VPS needs, so this is also the dependency
      # the deployment doc names.
      - name: Install poppler-utils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          pdftotext -v

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and application tests
        run: npm test

      - name: Production build
        run: npm run build

  database:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # The version production runs. A suite that passes on another major
        # version has not tested production's behaviour.
        image: postgres:16
        env:
          POSTGRES_USER: eje
          POSTGRES_PASSWORD: eje
          POSTGRES_DB: eje_test
        ports:
          - 5432:5432
        # The job must not start until the server is actually accepting
        # connections, or the first test file races the container's startup.
        options: >-
          --health-cmd "pg_isready -U eje -d eje_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Disposable, named as a test database — which `testDatabaseUrl` insists
      # on, because these tests TRUNCATE every table.
      TEST_DATABASE_URL: postgres://eje:eje@127.0.0.1:5432/eje_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CLIENT TOOLS THAT MATCH THE SERVER, and this is not housekeeping.
      #
      # The runner image ships whatever `postgresql-client` Ubuntu currently
      # has — 17 as of 20 October 2026 — while the service container above is
      # the 16 that production runs. `pg_dump 17` writes `SET
      # transaction_timeout` into its output and PostgreSQL 16 has no such
      # parameter, so every restore of every dump died with "unrecognized
      # configuration parameter". The backup suite restores what it dumps, so
      # it is the suite that noticed; the same upgrade on the VPS would have
      # produced backups nobody could restore, which is why `versions.ts` now
      # refuses the mismatch rather than only CI pinning around it.
      - name: PostgreSQL 16 client tools, to match the service container
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --allow-downgrades postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: The client and the server agree
        run: |
          pg_dump --version
          psql "$TEST_DATABASE_URL" -At -c 'show server_version'

      # The suite builds its own schema from the migrations on every run
      # (`openTestDatabase` drops and recreates `public`), so the migrations
      # themselves are exercised here rather than assumed to have worked once.
      - name: Database-backed tests
        run: npm run db:test

      # ROLLBACK COMPATIBILITY OF THE NEXT RELEASE. Release readiness, de0d9b6.
      #
      # Migration 0030 cannot be un-run by switching the code back, so a
      # rollback means the LIVE release's code meeting a database at 0030. This
      # migrates the throwaway database above to 0030 with THIS release, then
      # runs the live release's own repository, searchability wording and
      # preflight rule against it, from a temporary worktree of the live commit.
      # It refuses outright if the two releases' lockfiles differ. The live
      # commit is pinned in the script; when the server moves to a new release,
      # that pin moves with it.
      - name: Rollback compatibility — the live release against a database at 0030
        run: bash scripts/release/rollback-compat.sh

  browser:
    name: Routes, workflow and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EJE_CHECK_URL: http://127.0.0.1:3210
      EJE_E2E_URL: http://127.0.0.1:3210
      EJE_SMOKE_BASE_URL: http://127.0.0.1:3210
      # Stated rather than inferred. These suites drive the DEMONSTRATION
      # backend — they reset it between runs — and must never be able to pick
      # up a `DATABASE_URL` that happens to be in the runner's environment.
      EJE_PERSISTENCE: demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Playwright's own Chromium, with the system libraries a headless browser
      # needs on a bare runner. Chromium only: nothing here tests Firefox or
      # WebKit, and installing them would cost minutes for no coverage.
      #
      # WHICH BINARY THIS LAUNCHES, AND WHY IT IS LEFT ALONE. This installs both
      # Chromium and `chrome-headless-shell`, and Playwright launches the shell.
      # The shell reports `navigator.pdfViewerEnabled === false` — the same
      # answer Chrome on Android gives, which is what the EJE tablets run — so
      # the signed job card is drawn as HTML here rather than handed to a
      # viewer. That is the more faithful of the two environments and it stays:
      # the suites assert whichever frame the browser is given, and
      # `tablet-pdf-check` below pins both capabilities explicitly.
      # THE LIBRARY'S PRIMARY SEARCH ENGINE. LIB-TEXT-1.
      #
      # `pdftotext` is what reads a manufacturer's manual: the built-in
      # fallback cannot resolve a subset font's /ToUnicode map, which is how
      # nearly every real manual is encoded. Installed EXPLICITLY rather than
      # relied on: the GitHub runner image happens to carry poppler today, and
      # a gate whose result depends on an undeclared package in somebody
      # else's image is a gate that will change its answer without a commit.
      # It is the same package the VPS needs, so this is also the dependency
      # the deployment doc names.
      - name: Install poppler-utils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          pdftotext -v

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      # Started as a background process and waited for through the health
      # route, which answers only once the process can serve: `sleep` would be
      # a guess, and a guess that is too short fails the run for no reason.
      - name: Start the application
        run: |
          npm start -- -p 3210 > /tmp/eje-server.log 2>&1 &
          echo "server_pid=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3210/api/health > /dev/null; then
              echo "the application is serving"
              exit 0
            fi
            sleep 2
          done
          echo "the application did not start"
          cat /tmp/eje-server.log
          exit 1

      - name: Route and permission check
        run: npm run check-routes

      - name: End-to-end workflow
        run: npm run e2e

      # PDF-3 and PDF-4: the signed document on a browser with a PDF viewer and
      # on one without. It is in CI because the runner's own browser is the one
      # without — see the note on `chrome-headless-shell` above — so the tablet
      # path is the path CI exercises everywhere else, and the desktop path
      # needs a gate of its own.
      - name: Signed document on both PDF paths
        run: npm run tablet-pdf-check

      # UX-1/CR-03: every screen measured at tablet and phone width — sideways
      # scroll, controls off the screen, tap targets, keyboard reach and long
      # content. It is in CI because these defects arrive by accident, in a
      # layout change nobody thought touched a tablet. It is NOT acceptance of
      # the tablet: that needs the real rugged device.
      - name: Tablet and phone layout
        run: npm run responsive-check

      - name: Smoke suite
        run: npm run smoke

      # The screenshots and the server log, for a failure somebody has to
      # diagnose from a transcript rather than a browser.
      #
      # `include-hidden-files` IS THE WHOLE STEP. The smoke suite writes its
      # screenshots to `.smoke/`, which begins with a dot, and this action
      # excludes hidden files by default — so the one run that failed and
      # needed them uploaded the server log and nothing else, and said so in
      # one line nobody reads: "there will be 1 file uploaded".
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-gate-evidence
          path: |
            .smoke/
            /tmp/eje-server.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Stop the application
        if: always()
        run: kill "${server_pid}" 2>/dev/null || true
